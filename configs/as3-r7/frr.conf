frr version 10.6.1_git
frr defaults traditional
hostname as3-r7
service integrated-vtysh-config
!
ip route 192.168.3.0/24 Null0
!
interface eth1
 ip address 10.3.0.1/31
 ip router isis AS3
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface lo
 ip address 10.255.3.7/32
 ip router isis AS3
 isis passive
exit
!
router bgp 65003
 bgp router-id 10.255.3.7
 neighbor 10.255.3.6 remote-as 65003
 neighbor 10.255.3.6 update-source lo
 !
 address-family ipv4 unicast
  network 192.168.3.0/24
 exit-address-family
exit
!
router isis AS3
 is-type level-2-only
 net 49.0003.0000.0000.0007.00
exit
!
