frr version 10.6.1_git
frr defaults traditional
hostname as2-r5
service integrated-vtysh-config
!
ip prefix-list PL-FROM-AS65003 seq 10 permit 192.168.3.0/24
ip prefix-list PL-TO-AS65003 seq 10 permit 192.168.1.0/24
!
route-map RM-FROM-AS65003 permit 10
 match ip address prefix-list PL-FROM-AS65003
exit
!
route-map RM-TO-AS65003 permit 10
 match ip address prefix-list PL-TO-AS65003
exit
!
interface eth1
 ip address 10.2.0.3/31
 ip router isis AS2
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface eth2
 ip address 10.2.0.5/31
 ip router isis AS2
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface eth3
 ip address 10.254.0.2/31
 ip router isis AS2
 isis passive
exit
!
interface lo
 ip address 10.255.2.5/32
 ip router isis AS2
 isis passive
exit
!
router bgp 65002
 bgp router-id 10.255.2.5
 neighbor 10.254.0.3 remote-as 65003
 neighbor 10.255.2.3 remote-as 65002
 neighbor 10.255.2.3 update-source lo
 neighbor 10.255.2.4 remote-as 65002
 neighbor 10.255.2.4 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.254.0.3 route-map RM-FROM-AS65003 in
  neighbor 10.254.0.3 route-map RM-TO-AS65003 out
 exit-address-family
exit
!
router isis AS2
 is-type level-2-only
 net 49.0002.0000.0000.0005.00
exit
!
