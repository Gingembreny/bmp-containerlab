frr version 10.6.1_git
frr defaults traditional
hostname as3-r6
service integrated-vtysh-config
!
ip prefix-list PL-FROM-AS65002 seq 10 permit 192.168.1.0/24
ip prefix-list PL-TO-AS65002 seq 10 permit 192.168.3.0/24
!
route-map RM-FROM-AS65002 permit 10
 match ip address prefix-list PL-FROM-AS65002
exit
!
route-map RM-TO-AS65002 permit 10
 match ip address prefix-list PL-TO-AS65002
exit
!
interface eth1
 ip address 10.3.0.0/31
 ip router isis AS3
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface eth2
 ip address 10.254.0.3/31
 ip router isis AS3
 isis passive
exit
!
interface lo
 ip address 10.255.3.6/32
 ip router isis AS3
 isis passive
exit
!
router bgp 65003
 bgp router-id 10.255.3.6
 neighbor 10.254.0.2 remote-as 65002
 neighbor 10.255.3.7 remote-as 65003
 neighbor 10.255.3.7 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.254.0.2 route-map RM-FROM-AS65002 in
  neighbor 10.254.0.2 route-map RM-TO-AS65002 out
 exit-address-family
exit
!
router isis AS3
 is-type level-2-only
 net 49.0003.0000.0000.0006.00
exit
!
