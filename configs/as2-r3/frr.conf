frr version 10.6.1_git
frr defaults traditional
hostname as2-r3
service integrated-vtysh-config
!
ip prefix-list PL-FROM-AS65001 seq 10 permit 192.168.1.0/24
ip prefix-list PL-TO-AS65001 seq 10 permit 192.168.3.0/24
!
route-map RM-FROM-AS65001 permit 10
 match ip address prefix-list PL-FROM-AS65001
exit
!
route-map RM-TO-AS65001 permit 10
 match ip address prefix-list PL-TO-AS65001
exit
!
interface eth1
 ip address 10.254.0.1/31
 ip router isis AS2
 isis passive
exit
!
interface eth2
 ip address 10.2.0.0/31
 ip router isis AS2
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface eth3
 ip address 10.2.0.4/31
 ip router isis AS2
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface lo
 ip address 10.255.2.3/32
 ip router isis AS2
 isis passive
exit
!
router bgp 65002
 bgp router-id 10.255.2.3
 neighbor 10.254.0.0 remote-as 65001
 neighbor 10.255.2.4 remote-as 65002
 neighbor 10.255.2.4 update-source lo
 neighbor 10.255.2.5 remote-as 65002
 neighbor 10.255.2.5 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.254.0.0 route-map RM-FROM-AS65001 in
  neighbor 10.254.0.0 route-map RM-TO-AS65001 out
 exit-address-family
 !
 bmp targets NETCALYX
  bmp stats interval 60000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor ipv4 unicast loc-rib
  bmp connect 172.20.20.101 port 33000 min-retry 1000 max-retry 10000
 exit
 !
 bmp targets PMACCT
  bmp stats interval 60000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor ipv4 unicast loc-rib
  bmp connect 172.20.20.100 port 1790 min-retry 1000 max-retry 10000
 exit
exit
!
router isis AS2
 is-type level-2-only
 net 49.0002.0000.0000.0003.00
exit
!
