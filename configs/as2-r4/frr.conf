frr version 10.6.1_git
frr defaults traditional
hostname as2-r4
service integrated-vtysh-config
!
interface eth1
 ip address 10.2.0.1/31
 ip router isis AS2
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface eth2
 ip address 10.2.0.2/31
 ip router isis AS2
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface lo
 ip address 10.255.2.4/32
 ip router isis AS2
 isis passive
exit
!
router bgp 65002
 bgp router-id 10.255.2.4
 neighbor 10.255.2.3 remote-as 65002
 neighbor 10.255.2.3 update-source lo
 neighbor 10.255.2.5 remote-as 65002
 neighbor 10.255.2.5 update-source lo
exit
!
router isis AS2
 is-type level-2-only
 net 49.0002.0000.0000.0004.00
exit
!
