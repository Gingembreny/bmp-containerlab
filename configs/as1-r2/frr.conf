frr version 10.6.1_git
frr defaults traditional
hostname as1-r2
service integrated-vtysh-config
!
ip prefix-list PL-TO-AS65002 seq 10 permit 192.168.1.0/24
ip prefix-list PL-FROM-AS65002 seq 10 permit 192.168.3.0/24
!
route-map RM-TO-AS65002 permit 10
 match ip address prefix-list PL-TO-AS65002
exit
!
route-map RM-FROM-AS65002 permit 10
 match ip address prefix-list PL-FROM-AS65002
exit
!
interface eth1
 ip address 10.1.0.1/31
 ip router isis AS1
 isis circuit-type level-2-only
 isis network point-to-point
exit
!
interface eth2
 ip address 10.254.0.0/31
 ip router isis AS1
 isis passive
exit
!
interface lo
 ip address 10.255.1.2/32
 ip router isis AS1
 isis passive
exit
!
router bgp 65001
 bgp router-id 10.255.1.2
 neighbor 10.254.0.1 remote-as 65002
 neighbor 10.255.1.1 remote-as 65001
 neighbor 10.255.1.1 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.254.0.1 route-map RM-FROM-AS65002 in
  neighbor 10.254.0.1 route-map RM-TO-AS65002 out
 exit-address-family
exit
!
router isis AS1
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
exit
!
